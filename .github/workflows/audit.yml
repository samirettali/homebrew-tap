name: audit

# The casks here are maintained from a machine without Homebrew installed, so
# this is where they actually get linted and installed for real. No secrets.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# --online talks to the GitHub API, and unauthenticated runners share one IP:
# 60 requests an hour, which two parallel jobs exhaust on their own.
env:
  HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Homebrew only lints casks it can see as a tap, so hand it this checkout
      # under the name it expects.
      - name: Register the checkout as samirettali/tap
        run: |
          set -euo pipefail
          taps="$(brew --repository)/Library/Taps/samirettali"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"

      # Homebrew ignores third-party taps until they are trusted, which would
      # silently skip everything below.
      - name: Trust the tap
        run: brew trust samirettali/tap

      - name: Style
        run: brew style samirettali/tap

      # Every cask, not a named one: a hardcoded token means a new cask is
      # silently never checked, and the job still goes green.
      # --online also checks that the download URL and homepage resolve.
      - name: Audit
        run: |
          set -euo pipefail
          for cask in Casks/*.rb; do
            brew audit --cask --online "samirettali/tap/$(basename "$cask" .rb)"
          done

      # The real end-to-end test: the DMG downloads, mounts, and the app comes
      # out of it where the cask says it will.
      - name: Install and uninstall
        run: |
          set -euo pipefail
          for cask in Casks/*.rb; do
            token=$(basename "$cask" .rb)
            brew install --cask "samirettali/tap/$token"
            brew uninstall --cask "samirettali/tap/$token"
          done

  # Formulae build from source here, which the casks never do, so they get their
  # own job: a compile failure must not read as a broken cask.
  formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register the checkout as samirettali/tap
        run: |
          set -euo pipefail
          taps="$(brew --repository)/Library/Taps/samirettali"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"

      - name: Trust the tap
        run: brew trust samirettali/tap

      - name: Audit
        run: |
          set -euo pipefail
          for formula in Formula/*.rb; do
            brew audit --formula --online --strict "samirettali/tap/$(basename "$formula" .rb)"
          done

      # Building here is the point: my machines either have no Homebrew at all
      # or already run the same formula from another tap.
      - name: Install, test and uninstall
        run: |
          set -euo pipefail
          for formula in Formula/*.rb; do
            token=$(basename "$formula" .rb)
            brew install --build-from-source "samirettali/tap/$token"
            brew test "samirettali/tap/$token"
            brew uninstall "samirettali/tap/$token"
          done
